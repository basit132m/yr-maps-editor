<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }} &mdash; Upgrade Your Yuri&rsquo;s Revenge Maps{% endblock %}</title>
<meta name="description" content="Upload a Red Alert 2: Yuri's Revenge map and add unlimited money, auto-repair and faster building. Free, instant, no install.">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" href="/static/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta property="og:title" content="{{ site_name }}">
<meta property="og:description" content="Add unlimited money, auto-repair and faster building to any Yuri's Revenge map.">
<meta property="og:image" content="/static/mark.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=13">
<script>
/* Set the theme before the first paint, or the page flashes dark then light. */
(function () {
  var root = document.documentElement;
  root.classList.add('js');
  try {
    var saved = localStorage.getItem('yrme-theme');
    if (saved === 'light' || saved === 'dark') { root.dataset.theme = saved; return; }
  } catch (e) { /* private mode: fall through to the system preference */ }
  if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) {
    root.dataset.theme = 'light';
  }
})();
</script>
</head>
<body>

<div class="topstrip">
  <span class="topstrip-left">
    <span class="dot"></span>
    Map Upgrade Tool for Red Alert 2 &mdash; Yuri&rsquo;s Revenge
  </span>
  <span class="topstrip-right">
    <button type="button" class="theme-toggle" data-theme-toggle
            aria-label="Switch between light and dark theme">
      <svg class="to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
      </svg>
      <svg class="to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5z"/>
      </svg>
      <span>Theme</span>
    </button>
    {% if user %}
      <a class="who" href="/account">
        <span class="avatar" aria-hidden="true">{{ user.initials }}</span>
        {{ user.display_name }}
      </a>
    {% else %}
      <a href="/signin">Sign in</a>
    {% endif %}
    <a href="https://www.bankofyrmaps.com/" target="_blank" rel="noopener">
      Bank of YR Maps <span aria-hidden="true">&rarr;</span>
    </a>
  </span>
</div>

<main>
{% block content %}{% endblock %}
</main>

<p class="engine">
  Engine created by
  <a href="https://www.bankofyrmaps.com/" target="_blank" rel="noopener">Bank of YR Maps</a>
</p>

<script src="/static/app.js?v=2" defer></script>
</body>
</html>
