{% extends "base.html" %}
{% block title %}Sign in &mdash; {{ site_name }}{% endblock %}
{% block content %}
<section class="page-head narrow">
  <p class="eyebrow">Your account</p>
  <h1>Sign in</h1>
</section>

<section class="panel narrow">
  {% if message %}<p class="note">{{ message }}</p>{% endif %}
  {% if error %}<p class="note warn">{{ error }}</p>{% endif %}

  <form action="/signin" method="post" class="stack">
    <div class="field">
      <label for="email">Gmail address</label>
      <input id="email" name="email" type="email" autocomplete="username"
             value="{{ email or '' }}" placeholder="you@gmail.com" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-block"><span>Sign in</span></button>
  </form>

  <p class="switch">No account yet? <a href="/signup">Create one</a></p>
</section>
{% endblock %}
